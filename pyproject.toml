[project]
name = "animalcam"
version = "0.1.0"
description = "A small wildlife cam observer and image journal"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "uvicorn>=0.32,<1",
  "yt-dlp[default]>=2026.10.26",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
